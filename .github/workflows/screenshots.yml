name: Update screenshots

# After every change to the look on main, and by hand. The pictures are committed with the
# GITHUB_TOKEN, which starts no other workflow, so they don't run the checks or themselves again.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "messages/**"
      - "tests/e2e/screenshots.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # The Bun of `packageManager` in package.json, as setup-bun takes it in ci.yml; the image has
      # npm and node, but no unzip for Bun's installer and no jq (not the workflow's `bun-version`
      # input, which would be a second place for the version)
      install: >-
        npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        && bun install --frozen-lockfile
      lockfile: bun.lock
      command: bun run build && bun run screenshots
      paths: docs/screenshots
    permissions:
      contents: write
