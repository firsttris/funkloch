name: CI

on:
  push:
    branches: [main]            # not every branch, pull requests build through pull_request
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_call:                # release.yml runs the same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its outdated run; runs on main and tags finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint and format
        run: bunx biome ci .
      - name: Unit, contract and database tests
        run: bun run test
      - name: Build
        run: bun run build

  # Layer 4: the Zigbee adapter against a real broker; on main and before a release only
  integration:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Mosquitto
        run: docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 mosquitto -c /mosquitto-no-auth.conf
      - name: Integration tests
        run: bun run test:integration
        env:
          MQTT_TEST_URL: mqtt://localhost:1883

  playwright-image:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: playwright
        uses: firsttris/workflows/actions/playwright-image@v1
        with:
          lockfile: bun.lock

  # Layer 6: every page in demo mode; Chromium on pull requests, all browsers on main and releases.
  # In two halves at once: the browsers, not the build, take most of the job.
  e2e:
    needs: playwright-image
    name: e2e ${{ matrix.shard }}/2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-image.outputs.image }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      # The npm package brings the binary without curl or unzip, which the image lacks
      - run: npm install --global "bun@$(jq -r .packageManager package.json | cut -d@ -f2)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Playwright
        # Firefox refuses to start as root with a $HOME owned by another user
        env:
          HOME: /root
        run: bunx playwright test --shard=${{ matrix.shard }}/2 ${{ github.event_name == 'pull_request' && '--project=chromium --project=auth' || '--project=chromium --project=firefox --project=webkit --project=auth' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # Whether this push touches what the image is built from beyond the code the jobs above build
  # and test: then the docker job builds it. By hand always; never for a release tag, whose images
  # release.yml builds right after.
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "docker=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            push) from="$BEFORE" ;;
            pull_request) from="$BASE" ;;
            *) from="" ;;
          esac
          if [ -z "$from" ] || ! git cat-file -e "$from^{commit}" 2>/dev/null; then
            docker=true
          elif git diff --name-only "$from" HEAD | grep -qE '^(docker/|\.dockerignore|serve\.ts|package\.json|bun\.lock|vite\.config\.ts|src/db/migrations/)'; then
            docker=true
          else
            docker=false
          fi
          echo "docker=$docker" | tee -a "$GITHUB_OUTPUT"

  # Layer 7: the image starts on amd64 and arm64 and /healthz turns green. Each platform on its own
  # native runner, its build cache shared with the release's (ghcr.io/firsttris/funkloch-buildcache,
  # :linux-amd64 and :linux-arm64, as in firsttris/workflows docker-release.yml), so the release
  # finds the layers already built.
  docker:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    name: docker ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # keeps the build cache
    steps:
      - uses: actions/checkout@v7
      - uses: firsttris/workflows/actions/docker-build@v1
        with:
          dockerfile: docker/Dockerfile
          platform: ${{ matrix.platform }}
          tags: funkloch:ci
      - name: Start the image
        run: |
          docker run -d --name funkloch -e FUNKLOCH_DEMO=1 -p 127.0.0.1:8090:8090 funkloch:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/healthz; then break; fi
            sleep 2
          done
          docker logs funkloch
          curl -fsS http://127.0.0.1:8090/healthz
