name: Release

# The checks (ci.yml), then the shared Docker release from firsttris/workflows: amd64 and arm64
# each on its own native runner, pushed to Docker Hub, then the GitHub release. The image itself is
# started in ci.yml whenever what it is built from changes, so the release does not wait for it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  docker:
    needs: checks
    uses: firsttris/workflows/.github/workflows/docker-release.yml@v1
    with:
      image: tristanteu/funkloch
      description: Signal history, trends and alerts for every Zigbee2MQTT and Thread (OTBR) device
    secrets: inherit
    permissions:
      contents: write
      packages: write
